server:
  port: ${PORT:${SERVER_PORT:8080}}
  tomcat:
    max-connections: ${TOMCAT_MAX_CONNECTIONS:1000}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    threads:
      max: ${TOMCAT_MAX_THREADS:50}
      min-spare: 5
    connection-timeout: 20000
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml

spring:
  application:
    name: bridgeai-portal
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bridgeai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 60000
      connection-timeout: 30000
      max-lifetime: 180000
      keepalive-time: 30000
      leak-detection-threshold: 45000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 25MB

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  emailjs:
    service-id: ${EMAILJS_SERVICE_ID:}
    template-id: ${EMAILJS_TEMPLATE_ID:}
    public-key: ${EMAILJS_PUBLIC_KEY:}
  exam:
    max-violations: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
