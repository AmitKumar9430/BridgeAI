server:
  port: ${PORT:${SERVER_PORT:8080}}
  tomcat:
    max-connections: ${TOMCAT_MAX_CONNECTIONS:10000}
    accept-count: ${TOMCAT_ACCEPT_COUNT:2000}
    threads:
      max: ${TOMCAT_MAX_THREADS:400}
      min-spare: 40
    connection-timeout: 20000
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml

spring:
  application:
    name: bridgeai-portal
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bridgeai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:35}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 60000
      connection-timeout: 30000
      max-lifetime: 180000
      keepalive-time: 30000
      leak-detection-threshold: 45000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  emailjs:
    service-id: ${EMAILJS_SERVICE_ID:service_u63zkza}
    template-id: ${EMAILJS_TEMPLATE_ID:template_ftzgvwc}
    public-key: ${EMAILJS_PUBLIC_KEY:udHNyzfgZadsOjR97}
  exam:
    max-violations: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
