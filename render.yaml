services:
  - type: web
    name: bridgeai-portal-backend
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    region: oregon
    plan: standard
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: TOMCAT_MAX_CONNECTIONS
        value: "10000"
      - key: TOMCAT_MAX_THREADS
        value: "400"
      - key: TOMCAT_ACCEPT_COUNT
        value: "2000"
      - key: HIKARI_MAX_POOL_SIZE
        value: "35"
